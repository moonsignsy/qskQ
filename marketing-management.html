      ];

      var currentTab = 'following';
      var toast = document.getElementById('toast-mkt');
      var toastTimer = null;
      var theadRow = document.getElementById('mkt-thead-row');
      var tbody = document.getElementById('mkt-tbody');
      var emptyEl = document.getElementById('mkt-empty');
      var totalEl = document.getElementById('mkt-total');

      var filterIds = [
        'filter-channel', 'filter-wechat', 'filter-region', 'filter-dept',
        'filter-sales', 'filter-enterprise', 'filter-created-start', 'filter-created-end'
      ];

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.remove('hidden');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.add('hidden'); }, 1800);
      }

      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function rowDateKey(createdAt) {
        return String(createdAt || '').slice(0, 10);
      }

      function getFilters() {
        return {
          channel: document.getElementById('filter-channel').value,
          wechat: document.getElementById('filter-wechat').value,
          region: document.getElementById('filter-region').value,
          dept: document.getElementById('filter-dept').value,
          sales: document.getElementById('filter-sales').value,
          enterprise: document.getElementById('filter-enterprise').value,
          createdStart: document.getElementById('filter-created-start').value,
          createdEnd: document.getElementById('filter-created-end').value
        };
      }

      function matchFilters(row, f) {
        if (f.channel && row.channel !== f.channel) return false;
        if (f.wechat && row.wechat !== f.wechat) return false;
        if (f.region && row.region !== f.region) return false;
        if (f.dept && row.dept !== f.dept) return false;
        if (f.sales && row.sales !== f.sales) return false;
        if (f.enterprise && row.enterprise !== f.enterprise) return false;
        var d = rowDateKey(row.createdAt);
        if (f.createdStart && d < f.createdStart) return false;
        if (f.createdEnd && d > f.createdEnd) return false;
        return true;
      }

      function columnsForTab(tab) {
        var base = [
          { key: 'name', label: '客户姓名' },
          { key: 'phone', label: '手机号码' },
          { key: 'region', label: '所属区域' },
          { key: 'enterprise', label: '企业类型' },
          { key: 'wechat', label: '添加微信' },
          { key: 'dept', label: '所属部门' },
          { key: 'sales', label: '销售顾问' }
        ];
        if (tab === 'following' || tab === 'intent') {
          base.push({ key: 'lastFollow', label: '最后一次跟进' });
        } else if (tab === 'invalid') {
          base.push({ key: 'invalidReason', label: '无效说明' });
        } else if (tab === 'abandoned') {
          base.push({ key: 'abandonReason', label: '放弃说明' });
        } else if (tab === 'won') {
          base.push({ key: 'contractType', label: '合同类型' });
          base.push({ key: 'receiveAmount', label: '收款金额' });
        } else if (tab === 'lost') {
          base.push({ key: 'lostReason', label: '流失说明' });
        }
        base.push({ key: 'createdAt', label: '创建时间' });
        return base;
      }

      function renderTable() {
        var cols = columnsForTab(currentTab);
        var f = getFilters();
        var list = rows.filter(function (r) {
          return r.tab === currentTab && matchFilters(r, f);
        });

        theadRow.innerHTML = cols.map(function (c) {
          return '<th class="text-left">' + escapeHtml(c.label) + '</th>';
        }).join('');

        if (!list.length) {
          tbody.innerHTML = '';
          emptyEl.classList.remove('hidden');
        } else {
          emptyEl.classList.add('hidden');
          tbody.innerHTML = list.map(function (row) {
            return '<tr>' + cols.map(function (c) {
              var val = row[c.key];
              if (val == null || val === '') val = '--';
              var cls = (c.key === 'lastFollow' && val !== '--') ? ' class="text-amber-600 font-medium"' : '';
              return '<td' + cls + '>' + escapeHtml(val) + '</td>';
            }).join('') + '</tr>';
          }).join('');
        }
        totalEl.textContent = String(list.length);
      }

      function setTab(tab) {
        currentTab = tab;
        document.querySelectorAll('#mkt-tabs .mkt-tab').forEach(function (btn) {
          var on = btn.getAttribute('data-tab') === tab;
          btn.classList.toggle('border-blue-600', on);
          btn.classList.toggle('text-blue-600', on);
          btn.classList.toggle('font-medium', on);
          btn.classList.toggle('mkt-tab-active', on);
          btn.classList.toggle('border-transparent', !on);
          btn.classList.toggle('text-slate-500', !on);
        });
        renderTable();
      }

      document.querySelectorAll('#mkt-tabs .mkt-tab').forEach(function (btn) {
        btn.addEventListener('click', function () {
          setTab(btn.getAttribute('data-tab'));
        });
      });

      document.getElementById('btn-mkt-search').addEventListener('click', function () {
        renderTable();
        showToast('查询完成');
      });

      document.getElementById('btn-mkt-reset').addEventListener('click', function () {
        filterIds.forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.value = '';
        });
        renderTable();
        showToast('已重置');
      });

      document.getElementById('btn-mkt-export').addEventListener('click', function () {
        showToast('导出成功');
      });

      setTab('following');
    })();
  </script>
